# "A non-loopback default here lets `docker run` bind every interface."
# "A wider default lets any peer forge X-Forwarded-* headers."
#
# The comment states the consequence of a hypothetical change and leaves
# the instruction implicit. Lead with the imperative, then the why: "Keep
# the default on loopback; anything wider bypasses the authn-proxy
# sidecar."
#
# Two tells, both narrow so ordinary declarative comments stay legal:
# "here" plus a consequence verb marks a rationale aimed at this code, and
# a configuration noun (default, setting, flag) plus a consequence verb
# marks the same shape without the "here".
#
# NOTE: Vale CONCATENATES multiple `raw:` entries into a single pattern
# rather than alternating them. Keep every alternative inside one entry.
extends: existence
message: "Rationale-first comment ('%s'). Give the instruction in the imperative, then the why."
level: suggestion
ignorecase: true
nonword: true
raw:
  - '\b(?:here (?:lets|allows|means|causes|makes|keeps|enables|ensures|prevents|avoids|would)|(?:default|defaults|value|setting|flag|option|mode|policy|permission|scope|binding|port|timeout|limit) (?:lets|allows|permits|exposes|opens|invites) )\b'
